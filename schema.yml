components:
  schemas:
    Mailing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 100
        date_first_dispatch:
          type: string
          format: date-time
          title: Дата первой отправки
        dispatch_end_date:
          type: string
          format: date-time
          title: Дата окончания отправки
        periodicity:
          allOf:
          - $ref: '#/components/schemas/PeriodicityEnum'
          title: Периодичность
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Статус
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        message:
          type: integer
        recipients:
          type: array
          items:
            type: integer
      required:
      - created_at
      - date_first_dispatch
      - dispatch_end_date
      - id
      - message
      - name
      - recipients
      - status
      - updated_at
      - user
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 200
        body:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - body
      - created_at
      - id
      - subject
      - user
    PaginatedMailingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Mailing'
    PaginatedMessageList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    PaginatedRecipientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
    PatchedMailing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 100
        date_first_dispatch:
          type: string
          format: date-time
          title: Дата первой отправки
        dispatch_end_date:
          type: string
          format: date-time
          title: Дата окончания отправки
        periodicity:
          allOf:
          - $ref: '#/components/schemas/PeriodicityEnum'
          title: Периодичность
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Статус
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        message:
          type: integer
        recipients:
          type: array
          items:
            type: integer
    PatchedMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 200
        body:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
    PatchedRecipient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          title: ФИО
          maxLength: 100
        comment:
          type: string
          nullable: true
          title: Комментарий
        is_active:
          type: boolean
        user:
          type: integer
          readOnly: true
    PeriodicityEnum:
      enum:
      - once
      - daily
      - weekly
      type: string
      description: |-
        * `once` - Один раз
        * `daily` - Каждый день
        * `weekly` - Раз в неделю
    Recipient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          title: ФИО
          maxLength: 100
        comment:
          type: string
          nullable: true
          title: Комментарий
        is_active:
          type: boolean
        user:
          type: integer
          readOnly: true
      required:
      - email
      - id
      - name
      - user
    StatusEnum:
      enum:
      - created
      - launched
      - completed
      - stopped
      type: string
      description: |-
        * `created` - Создана
        * `launched` - Запущена
        * `completed` - Завершена
        * `stopped` - Остановлена
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
