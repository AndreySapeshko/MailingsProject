        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Сообщение.
        required: true
      tags:
      - messages
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    put:
      operationId: messages_update
      description: |-
        API endpoint for managing email messages.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Сообщение.
        required: true
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Message'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Message'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    patch:
      operationId: messages_partial_update
      description: |-
        API endpoint for managing email messages.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Сообщение.
        required: true
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMessage'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: messages_destroy
      description: |-
        API endpoint for managing email messages.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
