[project]
name = "mailingsproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "django-debug-toolbar (==4.3.0)",
    "whitenoise (==6.7.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "ipython (>=9.6.0,<10.0.0)",
    "django-apscheduler (>=0.7.0,<0.8.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "django-environ (>=0.12.0,<0.13.0) ; python_version >= \"3.13\" and python_version < \"4\"",
    "django-redis (>=6.0.0,<7.0.0)",
    "celery (==5.3.6)",
    "django-celery-beat (>=2.8.1,<3.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "django-celery-results (==2.5.1)",
    "django-jazzmin (==3.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^25.9.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.18.2"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119
