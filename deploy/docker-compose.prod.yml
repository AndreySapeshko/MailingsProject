services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: ["gunicorn", "mailings_project.wsgi:application", "--bind", "0.0.0.0:8000"]
    env_file:
      - .env
    volumes:
      - static_volume:/static
      - media_volume:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static_volume:/static
      - media_volume:/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  celery:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "celery_app", "worker", "-l", "info"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "celery_app", "beat", "-l", "info"]
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
