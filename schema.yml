openapi: 3.0.3
info:
  title: Mailings Service API
  version: 1.0.0
  description: Сервис email-рассылок с планировщиком и ролями доступа
paths:
  /api/mailings/:
    get:
      operationId: mailings_list
      description: Кеширование списка
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - mailings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMailingList'
          description: ''
    post:
      operationId: mailings_create
      description: |-
        API endpoint for managing email mailings.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      tags:
      - mailings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mailing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Mailing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Mailing'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailing'
          description: ''
  /api/mailings/{id}/:
    get:
      operationId: mailings_retrieve
      description: Кеширование детального просмотра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Рассылка.
        required: true
      tags:
      - mailings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailing'
          description: ''
    put:
      operationId: mailings_update
      description: |-
        API endpoint for managing email mailings.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Рассылка.
        required: true
      tags:
      - mailings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mailing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Mailing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Mailing'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailing'
          description: ''
    patch:
      operationId: mailings_partial_update
      description: |-
        API endpoint for managing email mailings.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Рассылка.
        required: true
      tags:
      - mailings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMailing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMailing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMailing'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailing'
          description: ''
    delete:
      operationId: mailings_destroy
      description: |-
        API endpoint for managing email mailings.

        - Только пользователь-владелец может изменять данные
        - Менеджер может только просматривать
        - Администратор имеет полный доступ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Рассылка.
        required: true
      tags:
      - mailings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
