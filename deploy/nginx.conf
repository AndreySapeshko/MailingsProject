server {
    listen 80;
    server_name localhost;

    # Проксируем на Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Отдача статики
    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }
}
